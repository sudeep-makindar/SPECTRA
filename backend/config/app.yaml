# ──────────────────────────────────────────────────────────────────────
# Spectra — Application Configuration
# ──────────────────────────────────────────────────────────────────────
# Override any value with SPECTRA_<SECTION>_<KEY> env vars.
# Example: SPECTRA_SERVER_PORT=9000

server:
  host: "0.0.0.0"
  port: 8000
  reload: false
  log_level: "info"
  cors_origins:
    - "*"

video:
  analysis_fps: 5
  yolo_model: "yolo26s.pt"   # yolo26n.pt is ~3× faster if the load test shows a slow computer
  preview_width: 640
  preview_quality: 70
  flow_width: 320
  flow_height: 180
  baseline_window_s: 60.0

audio:
  sample_rate: 16000
  window_s: 2.0
  hop_s: 1.0
  model_name: "MIT/ast-finetuned-audioset-10-10-0.4593"
  model_mode: "pretrained"

evidence:
  ring_buffer_s: 15.0
  pre_event_s: 8.0
  post_event_s: 6.0
  retention_days: 30
  face_blur: true    # blur faces in stored incident clips (privacy by design)

# AI co-pilot — any OpenAI-compatible LLM. Only structured signal metadata is
# sent, never video or audio. Keys come from the environment / .env:
#   groq → GROQ_API_KEY (free tier) · xai → XAI_API_KEY · openrouter → OPENROUTER_API_KEY
#   gemini → GEMINI_API_KEY · ollama → none (fully local)
# Without a key, briefings fall back to offline templates.
llm:
  provider: "groq"
  model: ""        # empty = provider default (auto-switches if that model is retired)
  api_key: ""
  base_url: ""

sim_mode: false
debug: false
